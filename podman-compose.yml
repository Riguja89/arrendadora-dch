# Infraestructura LOCAL de desarrollo/pruebas — Arrendadora (Podman / podman-compose).
# NO es producción. Secretos = valores dev triviales. Puertos publicados solo en localhost.
#
# Uso:
#   podman compose -f podman-compose.yml up -d
#   podman compose -f podman-compose.yml down          # conserva volúmenes
#   podman compose -f podman-compose.yml down -v       # borra datos
#
# Servicios:
#   postgres   → BD de la API (extensiones citext / pg_trgm se crean vía migración Prisma)
#   localstack → emulador AWS S3 (para el futuro adaptador S3 de admin-multimedia, ADR-008)

services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: arrendadora-postgres
    environment:
      POSTGRES_USER: arrendadora
      POSTGRES_PASSWORD: arrendadora
      POSTGRES_DB: arrendadora_dev
    ports:
      # Bind solo a loopback — no exponer a la LAN (infra de dev).
      # Host 5433 (no 5432) para NO chocar con un PostgreSQL nativo de Windows
      # que ya escucha en 0.0.0.0:5432 en esta máquina. Dentro del contenedor sigue en 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - arrendadora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arrendadora -d arrendadora_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  localstack:
    image: docker.io/localstack/localstack:latest
    container_name: arrendadora-localstack
    environment:
      SERVICES: s3
      DEBUG: "0"
      # Persistencia de datos S3 entre reinicios del contenedor.
      PERSISTENCE: "1"
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - arrendadora_localstack:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  arrendadora_pgdata:
  arrendadora_localstack:
